# ==========================================
# Go Gateway 配置文件模板
# ==========================================
# 使用方法：
# 1. 复制此文件为 config.yaml
# 2. 根据实际环境修改配置值
# 3. config.yaml 已被 .gitignore 忽略，不会提交到版本控制

# 服务器配置
server:
  port: 8080  # 网关服务监听端口

# Nacos 配置中心设置
nacos:
  host: "127.0.0.1"      # Nacos 服务器IP地址
  port: 8848             # Nacos 服务器端口
  namespace: "public"    # 命名空间ID (public为默认命名空间)
  group: "DEFAULT_GROUP" # 配置分组名
  dataid: "gateway.yaml" # 远程配置文件名 (需在Nacos控制台创建)

# ==========================================
# 注意事项：
# - 此文件为模板，不要直接使用
# - 实际的业务配置（如JWT密钥、服务白名单等）存储在 Nacos 中
# - 确保Nacos服务器可访问，否则网关无法启动
# ==========================================
